name: Release

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

jobs:
  call-release:
    uses: validator-labs/workflows/.github/workflows/release.yaml@533081ac49a832a478062407e23e559db6545f1d # main
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    secrets: inherit
